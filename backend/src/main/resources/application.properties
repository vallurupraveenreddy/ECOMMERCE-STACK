spring.application.name=ecommerce-backend
server.port=${PORT:8080}

# MySQL
spring.datasource.url=${DB_URL:jdbc:mysql://localhost:3306/ecommerce_db?allowPublicKeyRetrieval=true&useSSL=false&serverTimezone=UTC}
spring.datasource.username=root
spring.datasource.password=Root@123

# Hibernate
spring.jpa.hibernate.ddl-auto=update
spring.jpa.open-in-view=false
spring.jpa.properties.hibernate.jdbc.time_zone=UTC

# JWT
app.jwt.secret=${JWT_SECRET:}

# CORS
app.cors.origin=${CORS_ORIGIN:http://localhost:5173}

# Error handling
server.error.include-message=always

# Actuator
management.endpoints.web.exposure.include=health,info